name: CI Checks

on:
  push:
    branches: [develop]
    paths:
      - 'app/src/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
  pull_request:
    paths:
      - 'app/src/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Unit tests & Detekt

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests & detekt
        run: ./gradlew testDebugUnitTest detekt --no-daemon --continue -Dorg.gradle.warning.mode=summary

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7
