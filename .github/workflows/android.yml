name: Build & Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        type: string

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_artifacts:
    runs-on: ubuntu-latest
    name: Build artifacts
    outputs:
      track: ${{ steps.track.outputs.track }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_NAME: ${{ secrets.REPO_NAME }}
      PACKAGE_NAME: ${{ vars.APP_PACKAGE }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine release track
        id: track
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"beta"* ]]; then
            echo "track=beta" >> $GITHUB_OUTPUT
          else
            echo "track=production" >> $GITHUB_OUTPUT
          fi

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate android AAB
        run: ./gradlew bundleRelease -x test

      - name: Verify build output
        run: |
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB not found after build!"
            exit 1
          fi
          echo "AAB size: $(du -h app/build/outputs/bundle/release/app-release.aab | cut -f1)"

      - name: Sign AAB
        uses: ilharp/sign-android-release@v2
        id: sign_aab
        with:
          releaseDir: app/build/outputs/bundle/release
          signingKey: ${{ secrets.KEYSTORE_FILE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Create release folder
        run: mkdir -p release/distribution/whatsnew

      - name: Copy signed AAB
        run: |
          for file in ${{ steps.sign_aab.outputs.signedFiles }}; do
            cp "$file" "release/app-release.aab"
          done

      - name: Copy release notes
        run: |
          if [ -d "distribution/whatsnew" ]; then
            cp -r distribution/whatsnew/* release/distribution/whatsnew/ || true
          fi

      - uses: actions/upload-artifact@v4
        name: Upload artifact
        with:
          name: app-release
          if-no-files-found: error
          path: release

  publish_to_playstore:
    needs: build_artifacts
    name: Publish to Google PlayStore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        name: Retrieve artifacts
        with:
          name: app-release
          path: release

      - name: Upload Beta Release
        if: needs.build_artifacts.outputs.track == 'beta'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: ${{ vars.APP_PACKAGE }}
          releaseFiles: release/app-release.aab
          track: beta
          status: completed
          whatsNewDirectory: release/distribution/whatsnew

      - name: Upload Production Release
        if: needs.build_artifacts.outputs.track == 'production'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: ${{ vars.APP_PACKAGE }}
          releaseFiles: release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: release/distribution/whatsnew

  upload_release_assets:
    needs: publish_to_playstore
    name: Upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v4
        name: Retrieve artifacts
        with:
          name: app-release
          path: release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Version ${{ inputs.version || github.ref_name }}"
          files: release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
